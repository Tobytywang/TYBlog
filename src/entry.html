<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>{{title}}</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="css/entry.css">
    <script src="js/entry.js"></script>
</head>
<body>
    <main class="entry">
        <h1>{{title}}</h1>
        <p class="entry-subtitle">{{entryHint}}</p>
        <div class="entry-groups">
{{entryGroups}}
        </div>
        <p class="entry-note">{{entryNote}}</p>
    </main>
</body>
</html>
