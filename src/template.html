<!DOCTYPE html>
<html lang="{{htmlLang}}" data-img-base="{{imgBase}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <link rel="icon" href="{{faviconHref}}">
    <!-- iOS「添加到主屏幕」只认 PNG，不认 ico；缺了它会拿页面截图当图标。
         路径由构建按页面层级算出（根页 img/…，主题页 ../../img/…），不要手写。 -->
    <link rel="apple-touch-icon" href="{{appleTouchIconHref}}">
    <!-- 手机浏览器地址栏/状态栏的着色，取该主题的填充色。
         只写静态值：iOS 只在首帧读一次，用 JS 跟着节气改既不生效又多一处状态。 -->
    <meta name="theme-color" content="{{themeColor}}">
    <link rel="canonical" href="{{canonicalUrl}}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:url" content="{{canonicalUrl}}">
    <meta property="og:image" content="{{ogImageUrl}}">
    <meta property="og:image:alt" content="{{ogImageAlt}}">
    <!-- 刻意不写 og:image:width / height：这两个值只能和文件里的像素对上才有意义，
         而构建期读不出图片尺寸，写死就等于多一处「改图忘改数字」的静默漂移。
         比例靠图片本身（1200×630，1.91:1），爬虫少这两个提示不影响出图。 -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{title}}">
    <meta name="twitter:description" content="{{description}}">
    <meta name="twitter:image" content="{{ogImageUrl}}">
{{cssLinks}}
{{hreflangLinks}}
</head>
<body>
    <a class="skin-switcher" href="{{skinHref}}" title="{{skinTitle}}" aria-label="{{skinAria}}">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path d="M12 3a9 9 0 0 0 0 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.24-.27-.39-.62-.39-1.01 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" fill="currentColor"/>
        </svg>
    </a>
    <nav class="lang-nav" aria-label="{{navAria}}">
{{langLinks}}
    </nav>
    <div class="card">
        <div class="header">
            <h1>{{title}}</h1>
        </div>
        <div class="content">
            <p>{{motto}}</p>
            <div class="links">
                <a class="blog-link" href="https://www.cnblogs.com/happylich" target="_blank" rel="noopener noreferrer"><span class="dot" aria-hidden="true">·</span>{{cnblogs}}</a>
                <a class="blog-link" href="https://blog.tobyty.wang" target="_blank" rel="noopener noreferrer"><span class="dot" aria-hidden="true">·</span>{{blog}}</a>
            </div>
        </div>
        <div class="footer">
            <a href="https://beian.miit.gov.cn" target="_blank" rel="noopener noreferrer">蜀ICP备20003006号</a>
        </div>
    </div>{{keyboardHint}}
{{scriptLinks}}
</body>
</html>
