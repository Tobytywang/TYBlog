<!DOCTYPE html>
<html lang="{{htmlLang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>{{title}}</title>
{{cssLinks}}
{{hreflangLinks}}
</head>
<body data-entry-skin="{{entrySkin}}" data-primary="{{isPrimary}}">
    <div class="skin-switcher" role="button" tabindex="0" aria-label="切换主题">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path d="M12 3a9 9 0 0 0 0 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.24-.27-.39-.62-.39-1.01 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" fill="currentColor"/>
        </svg>
    </div>
    <nav class="lang-nav" aria-label="语言切换">
{{langLinks}}
    </nav>
    <div class="card">
        <div class="header">
            <p>{{title}}</p>
        </div>
        <div class="content">
            <p>{{motto}}</p>
            <div class="links">
                <a class="blog-link" href="https://www.cnblogs.com/happylich" target="_blank" rel="noopener noreferrer"><span class="dot" aria-hidden="true">·</span><span class="link-text">{{cnblogs}}</span></a>
                <a class="blog-link" href="https://blog.tobyty.wang" target="_blank" rel="noopener noreferrer"><span class="dot" aria-hidden="true">·</span><span class="link-text">{{blog}}</span></a>
            </div>
        </div>
        <div class="footer">
            <a href="https://beian.miit.gov.cn" target="_blank" rel="noopener noreferrer">蜀ICP备20003006号</a>
        </div>
    </div>
    <div class="keyboard-hint" aria-label="键盘快捷键提示">
        <span class="hint-group"><kbd>←</kbd><kbd>→</kbd><span>{{hintArrows}}</span></span>
        <span class="hint-divider" aria-hidden="true"></span>
        <span class="hint-group"><kbd>R</kbd><span>{{hintRandom}}</span></span>
    </div>
{{scriptLinks}}
</body>
</html>
